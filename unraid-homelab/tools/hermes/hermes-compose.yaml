services:
  hermes-w: &hermes_service
    container_name: hermes-w
    image: ghcr.io/zaggash/hermes-agent:v2026.8.3@sha256:99faa900fcfbff3c4184648bf6879df71ab4129f8317ce21a4e19773f55ed4ff
    command: gateway run
    labels:
      folder.view3: Tools
      net.unraid.docker.icon: file://${SECRET_APPDATA}/icons/hermes.png
    volumes:
      - "${SECRET_APPDATA}/hermes/w-agent:/opt/data/"
    environment:
      TZ: ${TZ}
      HERMES_UID: ${UID}
      HERMES_GID: ${GID}
    networks:
      - gluetun
    restart: always

  hermes-p:
    <<: *hermes_service
    container_name: hermes-p
    volumes:
      - "${SECRET_APPDATA}/hermes/p-agent:/opt/data/"
