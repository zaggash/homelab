services:
  hermes-w: &hermes_service
    container_name: hermes-w
    image: ghcr.io/zaggash/hermes-agent:v2026.8.19@sha256:234e1321c0c0c3f02f1f6851933a44c15fb84c7ca3e64495897c4f2b598f7a56
    command: gateway run
    labels:
      folder.view3: Tools
      net.unraid.docker.icon: file://${SECRET_APPDATA}/icons/hermes.png
    volumes:
      - "${SECRET_APPDATA}/hermes/w-agent:/opt/data/"
    environment:
      TZ: ${TZ}
      HERMES_UID: ${UID}
      HERMES_GID: ${GID}
    networks:
      - gluetun
    restart: always

  hermes-p:
    <<: *hermes_service
    container_name: hermes-p
    volumes:
      - "${SECRET_APPDATA}/hermes/p-agent:/opt/data/"
