services:
  vaultwarden:
    container_name: vaultwarden
    image: ghcr.io/dani-garcia/vaultwarden:1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
    labels:
      folder.view3: Tools
      net.unraid.docker.icon: file://${SECRET_APPDATA}/icons/vaultwarden.png
      traefik.enable: true
      traefik.docker.network: homelab_vaultwarden
      traefik.http.routers.vaultwarden.rule: Host(`pass.${SECRET_DOMAIN}`)
      traefik.http.routers.vaultwarden.entryPoints: websecure
      traefik.http.services.vaultwarden.loadbalancer.server.port: 8000
    volumes:
      - "${SECRET_APPDATA}/vaultwarden:/data"
    user: ${UID}:${GID}
    environment:
      TZ: ${TZ}
      PUSH_ENABLED: "true"
      PUSH_INSTALLATION_ID: "${SECRET_VAULTWARDEN_PUSH_ID}"
      PUSH_INSTALLATION_KEY: "${SECRET_VAULTWARDEN_PUSH_KEY}"
      PUSH_RELAY_URI: "https://api.bitwarden.eu"
      PUSH_IDENTITY_URI: "https://identity.bitwarden.eu"
      ROCKET_PORT: "8000"
      DATA_FOLDER: "/data"
      LOG_FILE: "/data/bitwarden.log"
      LOG_LEVEL: "info"
      EXTENDED_LOGGING: "true"
      ADMIN_TOKEN: "${SECRET_VAULTWARDEN_ADMIN_TOKEN}"
    networks:
      - vaultwarden
    restart: always

networks:
  vaultwarden:
