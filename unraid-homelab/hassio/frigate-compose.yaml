services:
  reolinkproxy:
    container_name: hassio-reolinkproxy
    image: ghcr.io/shareed2k/reolinkproxy:v0.2.7@sha256:5f0282d6cbe5913f51cbd6d2944d0c6bb86991da7b6b2aec524b8d236907b005
    labels:
      folder.view3: Hassio
    environment:
      TZ: ${TZ}
      REOLINK_SERVER_RTSP_ADDRESS: ":8556"
      REOLINK_CAMERA_0_NAME: "doorbell"
      REOLINK_CAMERA_0_HOST: "192.168.1.30"
      REOLINK_CAMERA_0_USERNAME: ${SECRET_DOORBELL_USERNAME}
      REOLINK_CAMERA_0_PASSWORD: ${SECRET_DOORBELL_PASSWORD}
      REOLINK_CAMERA_0_STREAM: "main,sub"
      REOLINK_CAMERA_0_TALK_PROFILE: "sub"
      REOLINK_ONVIF_USERNAME: ${SECRET_DOORBELL_USERNAME}
      REOLINK_ONVIF_PASSWORD: ${SECRET_DOORBELL_PASSWORD}
    networks:
      - hassio-frigate
    ports:
      - "192.168.1.50:8556:8556/tcp"
    restart: always

  frigate:
    container_name: hassio-frigate
    image: ghcr.io/blakeblackshear/frigate:0.18.1@sha256:ae4ee2505e4dba6313b02bf5e8eea6c35fb1119f7087b9f684082be0a9fa0a71
    labels:
      folder.view3: Hassio
      net.unraid.docker.icon: file://${SECRET_APPDATA}/icons/frigate.png
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    shm_size: "512mb"
    volumes:
      - "${SECRET_APPDATA}/hassio/frigate/config:/config"
      - "${SECRET_APPDATA}/hassio/frigate/media:/media/frigate"
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    networks:
      - hassio-frigate
    ports:
      - "192.168.1.50:8555:8555/tcp"
      - "192.168.1.50:8555:8555/udp"
    restart: always
