services:
  satisfactory-server:
    container_name: satisfactory-server
    image: ghcr.io/robtme/satisfactory-server:v1.10.0@sha256:ca895e72c78a586c4b9f50774a852f53915dc7299977af5ba26978607fad9213
    labels:
      folder.view3: Gaming
      net.unraid.docker.icon: file://${SECRET_APPDATA}/icons/satisfactory.png
    environment:
      PUID: "${UID}"
      PGID: "${GID}"
      TZ: "Europe/Paris"
      SERVERGAMEPORT: 7777
      AUTOSAVENUM: 20
      MAXPLAYERS: 1
      ROOTLESS: false
      STEAMBETA: false
    volumes:
      - "${SECRET_APPDATA}/satisfactory:/config"
    networks:
      - gaming
    ports:
      - "7777:7777/udp"
      - "7777:7777/tcp"
    restart: no
