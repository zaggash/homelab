services:
  books-db:
    container_name: books-db
    image: ghcr.io/linuxserver/mariadb:11.8.8@sha256:e1533463effa51906009471d281eb9ea602e5fb6dfc52e2eeb0215b5bc8ecd40
    labels:
      folder.view3: Media
      net.unraid.docker.icon: file://${SECRET_APPDATA}/icons/mariadb.png
    volumes:
      - "${SECRET_APPDATA}/grimmory/db:/config"
    environment:
      TZ: ${TZ}
      PUID: ${UID}
      PGID: ${GID}
      MYSQL_ROOT_PASSWORD: ${GRIMMORY_MARIADB_ROOTPW}
      MYSQL_DATABASE: ${GRIMMORY_DB}
      MYSQL_USER: ${GRIMMORY_MARIADB_USERNAME}
      MYSQL_PASSWORD: ${GRIMMORY_MARIADB_PASSWORD}
    networks:
      - media-backend
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
