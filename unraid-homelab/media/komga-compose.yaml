services:
  komga:
    container_name: komga
    image: ghcr.io/gotson/komga:1.29.2@sha256:1d89b79f6cee732438c0c51f876373ad1c6a0d6cdae47c008bfa24e1d1bed748
    labels:
      folder.view3: Media
      net.unraid.docker.icon: file://${SECRET_APPDATA}/icons/komga.png
      traefik.enable: true
      traefik.docker.network: homelab_media
      traefik.http.routers.komga.rule: Host(`comics.${SECRET_DOMAIN}`)
      traefik.http.routers.komga.entryPoints: websecure
      traefik.http.services.komga.loadbalancer.server.port: 25600
    user: "1000:1000"
    volumes:
      - "${SECRET_APPDATA}/komga/config:/config"
      - "${SECRET_DATADIR}/media/bd-manga-comics:/bd-manga-comics"
    environment:
      TZ: ${TZ}
    networks:
      - media
    restart: always
