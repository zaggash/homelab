services:
  clonarr:
    container_name: clonarr
    image: ghcr.io/prophetse7en/clonarr:v3.5.1@sha256:c9dfa0df2259a46c89fa60b819bfc9838e5930b1293d080a8a58b894b3ccff2f
    labels:
      folder.view3: Media
      net.unraid.docker.icon: file://${SECRET_APPDATA}/icons/clonarr.png
      traefik.enable: true
      traefik.docker.network: homelab_media
      traefik.http.routers.clonarr.rule: Host(`clonarr.${SECRET_DOMAIN}`)
      traefik.http.routers.clonarr.entryPoints: websecure
      traefik.http.services.clonarr.loadbalancer.server.port: 6060
    environment:
      TZ: ${TZ}
      PUID: ${UID}
      PGID: ${GID}
    volumes:
      - "${SECRET_APPDATA}/clonarr:/config"
    restart: unless-stopped
    networks:
      - media
