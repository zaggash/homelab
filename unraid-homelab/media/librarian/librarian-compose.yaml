services:
  signal-api:
    container_name: signal-api
    image: bbernhard/signal-cli-rest-api:0.100@sha256:2399d449123cdad56c4d859277e3b9127e1a00c4d2ab4601c239882609286cf8
    environment:
      - MODE=normal
      - TZ=${TZ}
    volumes:
      - "${SECRET_APPDATA}/signal-cli:/home/.local/share/signal-cli"
    networks:
      - media-backend
    restart: always

  librarian-bot:
    container_name: librarian-bot
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    depends_on:
      - signal-api
    shm_size: 1gb
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3072M
        reservations:
          memory: 1024M
    environment:
      SIGNAL_URL: http://signal-api:8080
      BOT_NUMBER: ${LIBRARIAN_BOT_NUMBER}
      AUTHORIZED_NUMBERS: ${LIBRARIAN_AUTHORIZED_NUMBERS}
      AUTHORIZED_GROUP: "Library"
      GRIMMORY_URL: ${LIBRARIAN_GRIMMORY_URL:-}
      GRIMMORY_USER: ${LIBRARIAN_GRIMMORY_USER:-}
      GRIMMORY_PASSWORD: ${LIBRARIAN_GRIMMORY_PASSWORD:-}
      GRIMMORY_AUTH_HEADER: ${LIBRARIAN_GRIMMORY_AUTH_HEADER:-Remote-User}
      GEMINI_API_KEY: ${LIBRARIAN_GEMINI_API_KEY}
      GEMINI_MODEL: ${LIBRARIAN_GEMINI_MODEL:-gemini-2.5-flash}
      PROWLARR_URL: ${LIBRARIAN_PROWLARR_URL:-http://prowlarr:9696}
      PROWLARR_API_KEY: ${LIBRARIAN_PROWLARR_API_KEY:-}
      QBITTORRENT_URL: ${LIBRARIAN_QBITTORRENT_URL:-http://gluetun:8080}
      QBITTORRENT_USER: ${LIBRARIAN_QBITTORRENT_USER:-}
      QBITTORRENT_PASSWORD: ${LIBRARIAN_QBITTORRENT_PASSWORD:-}
      QBITTORRENT_SAVE_PATH: ${LIBRARIAN_QBITTORRENT_SAVE_PATH:-/data/downloads/complete/ebooks_import}
      QBITTORRENT_TAG: ${LIBRARIAN_QBITTORRENT_TAG:-ebook}
      QBITTORRENT_CATEGORY: ${LIBRARIAN_QBITTORRENT_CATEGORY:-ebook}
      IMPORT_DIR: /books_import
      POLL_INTERVAL: 10
      HTTP_PROXY: http://gluetun:8888
      HTTPS_PROXY: http://gluetun:8888
      NO_PROXY: localhost,127.0.0.1,signal-api,grimmory,prowlarr,gluetun
    volumes:
      - "${SECRET_DATADIR}/downloads/complete/ebooks_import:/books_import"
    networks:
      - media-backend
      - gluetun
    restart: always
