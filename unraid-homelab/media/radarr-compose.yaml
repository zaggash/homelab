services:
  radarr:
    container_name: radarr
    image: ghcr.io/home-operations/radarr:6.4.1@sha256:260469d707617f4b5be1cd11a40be7e4889c63c5e7cdbc6a429626dc05863b6b
    labels:
      folder.view3: Media
      net.unraid.docker.icon: file://${SECRET_APPDATA}/icons/radarr.png
      traefik.enable: true
      traefik.docker.network: homelab_media
      traefik.http.routers.radarr.rule: Host(`radarr.${SECRET_DOMAIN}`)
      traefik.http.routers.radarr.entryPoints: websecure
      traefik.http.services.radarr.loadbalancer.server.port: 7878
    volumes:
      - "${SECRET_APPDATA}/radarr:/config"
      - "${SECRET_DATADIR}:/data"
    user: ${UID}:${GID}
    environment:
      TZ: ${TZ}
      COMPlus_EnableDiagnostics: "0" # Fix the .Net CoreCLR crash on ReadOnly Filesystem
    networks:
      - media
      - media-backend
      - gluetun
    restart: always
