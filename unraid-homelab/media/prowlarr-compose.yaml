services:
  prowlarr:
    container_name: prowlarr
    image: ghcr.io/home-operations/prowlarr:2.7.0@sha256:fcf7498692f97698ea8b8f7078a0f81120a16e7354e4c232b5e3810e3e783dff
    labels:
      folder.view3: Media
      net.unraid.docker.icon: file://${SECRET_APPDATA}/icons/prowlarr.png
      traefik.enable: true
      traefik.docker.network: homelab_media
      traefik.http.routers.prowlarr.rule: Host(`indexer.${SECRET_DOMAIN}`)
      traefik.http.routers.prowlarr.entryPoints: websecure
      traefik.http.services.prowlarr.loadbalancer.server.port: 9696
    volumes:
      - "${SECRET_APPDATA}/prowlarr:/config"
    user: ${UID}:${GID}
    environment:
      TZ: ${TZ}
      COMPlus_EnableDiagnostics: "0" # Fix the .Net CoreCLR crash on ReadOnly Filesystem
      PROWLARR__ANALYTICS_ENABLED: false
      PROWLARR__THEME: dark
    networks:
      - media
      - media-backend
      - gluetun
    restart: always
