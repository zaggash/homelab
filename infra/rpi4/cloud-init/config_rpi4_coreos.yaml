    - path: /etc/systemd/resolved.conf.d/fedora-coreos-stub-listener.conf
      mode: 0644
      contents:
        inline: |
          [Resolve]
          DNSStubListener=no

    - path: /etc/NetworkManager/system-connections/eth0.nmconnection
      mode: 0600
      contents:
        inline: |
          [connection]
          id=WiredStatic
          type=ethernet
          [match]
          interface-name=en*;eth*
          [ipv4]
          address1=192.168.1.10/24,192.168.1.1
          dns=1.1.1.1;1.0.0.1;
          dns-search=
          may-fail=false
          method=manual
          [ipv6]
          address1=2a01:e0a:83c:6b30::10/64,2a01:e0a:83c:6b30::1
          dns=2606:4700:4700::1111;2606:4700:4700::1001;
          dns-search=home.lan
          may-fail=false
          method=manual

    - path: /etc/selinux/config
      overwrite: true
      contents:
        inline: |
          SELINUX=disabled
          SELINUXTYPE=targeted

    - path: /etc/vconsole.conf
      mode: 0644
      contents:
        inline: KEYMAP=fr

    - path: /etc/modules-load.d/br_netfilter.conf
      mode: 0644
      contents:
        inline: br_netfilter

    - path: /etc/sysctl.d/custom.conf
      mode: 0644
      contents:
        inline: |
          net.bridge.bridge-nf-call-iptables = 1
          kernel.panic = 10
          kernel.panic_on_oops = 1
          vm.overcommit_memory = 1
          vm.panic_on_oom = 0
          net.ipv4.ip_forward = 1

    - path: /etc/hostname
      mode: 0644
      contents:
        inline: rpi4-docker

    - path: /etc/systemd/timesyncd.conf
      overwrite: true
      mode: 0644
      contents:
        inline: |
          [Time]
          NTP=0.fr.pool.ntp.org 1.fr.pool.ntp.org 2.fr.pool.ntp.org 3.fr.pool.ntp.org

    - path: /etc/ssh/sshd_config.d/20-custom-sshd.conf
      overwrite: true
      mode: 0644
      contents:
        inline: |
          # Use most defaults for sshd configuration.
          UsePrivilegeSeparation sandbox
          Subsystem sftp internal-sftp
          UseDNS no
          PermitRootLogin no
          AllowUsers core
          PasswordAuthentication no
          AuthenticationMethods publickey

    - path: /etc/sudoers.d/core-nopasswd
      mode: 0440
      contents:
        inline: |
          core ALL=(ALL:ALL) NOPASSWD: ALL

  links:
    - path: /etc/localtime
      target: ../usr/share/zoneinfo/Europe/Paris

systemd:
  units:
    - name: rpm-ostree-countme.timer
      enabled: false
      mask: true

    - name: portainer-agent.service
      enabled: true
      contents: |
        [Unit]
        Description=portainer-agent
        After=network-online.target
        Wants=network-online.target

        [Service]
        TimeoutStartSec=0
        ExecStartPre=-/bin/docker rm -f portainer_agent
        ExecStartPre=/bin/docker pull portainer/agent:latest
        ExecStart=/bin/docker run --name portainer_agent \
          -v /var/lib/docker/volumes:/var/lib/docker/volumes \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -p 9001:9001 \
          portainer/agent:latest
        Restart=always
        RestartSec=10s

        [Install]
        WantedBy=multi-user.target
