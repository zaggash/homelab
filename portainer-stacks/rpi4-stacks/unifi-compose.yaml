version: "3"
services:
  os-server:
    image: ghcr.io/lemker/unifi-os-server:v1.5.0@sha256:63c30ce405a21174e4639d26f0f3407d73482012d28a21f35c29e9a371dac7d1
    hostname: unifi
    domainname: home.lan
    dns:
      - 192.168.1.10
      - 1.1.1.1
    cgroup: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    extra_hosts:
      host.docker.internal: host-gateway
    tmpfs:
      - /run:exec,size=64m
      - /run/lock:size=16m
      - /tmp:exec,size=128m
      - /var/lib/journal:size=64m
      - /var/opt/unifi/tmp:size=64m
    environment:
      - UOS_SYSTEM_IP=unifi.home.lan
      - JVM_MAX_HEAP_SIZE=1024M
      - JVM_INIT_HEAP_SIZE=256M
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - persistent:/persistent
      - var-log:/var/log
      - data:/data
      - srv:/srv
      - var-lib-unifi:/var/lib/unifi
      - var-lib-mongodb:/var/lib/mongodb
      - etc-rabbitmq-ssl:/etc/rabbitmq/ssl
    ports:
      - 11443:443/tcp
      - 5005:5005/tcp # Optional
      - 9543:9543/tcp # Optional
      - 6789:6789/tcp # Optional
      - 8080:8080/tcp
      - 3478:3478/udp
      - 5514:5514/udp
      - 10003:10003/udp
      - 127.0.0.1:11084:11084
      - 28082:28082/tcp

    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
          
    restart: unless-stopped

volumes:
  persistent:
  var-log:
  data:
  srv:
  var-lib-unifi:
  var-lib-mongodb:
  etc-rabbitmq-ssl:
