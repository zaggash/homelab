version: "3"

services:
  dns: &backup_service
    image: offen/docker-volume-backup:v2.48.2@sha256:19102d8e59eb1d598cf8c647c2b21100abaadc5a1c808ac643fa612e323c3013
    restart: always
    dns:
      - 192.168.1.10
    environment: &backup_env
      BACKUP_FILENAME: "dns-%Y-%m-%dT%H-%M-%S.tar.gz"
      BACKUP_LATEST_SYMLINK: "dns-latest.tar.gz"
      BACKUP_ARCHIVE: "/archive/dns"
      BACKUP_SOURCE: "/backup/dns"
      BACKUP_CRON_EXPRESSION: "15 0 * * *"
      BACKUP_RETENTION_DAYS: "7"
      BACKUP_PRUNING_PREFIX: "dns-"
      NOTIFICATION_URLS: $PORTAINER_NOTIFICATION_URLS
      NOTIFICATION_LEVEL: "error"
    volumes:
      - "dns_config:/backup/dns/config:ro"
      - "dns_log:/backup/dns/log:ro"
      - "unraid_backups:/archive"

  unifi:
    <<: *backup_service
    environment:
      <<: *backup_env
      BACKUP_FILENAME: "unifi-%Y-%m-%dT%H-%M-%S.tar.gz"
      BACKUP_LATEST_SYMLINK: "unifi-latest.tar.gz"
      BACKUP_ARCHIVE: "/archive/unifi"
      BACKUP_SOURCE: "/backup/unifi"
      BACKUP_CRON_EXPRESSION: "15 0 * * *"
      BACKUP_RETENTION_DAYS: "7"
      BACKUP_PRUNING_PREFIX: "unifi-"
    volumes:
      - "unifi_persistent:/backup/unifi/persistent"
      - "unifi_var-log:/backup/unifi/var/log"
      - "unifi_data:/backup/unifi/data"
      - "unifi_srv:/backup/unifi/srv"
      - "unifi_var-lib-unifi:/backup/unifi/var/lib/unifi"
      - "unifi_var-lib-mongodb:/backup/unifi/var/lib/mongodb"
      - "unifi_etc-rabbitmq-ssl:/backup/unifi/etc/rabbitmq/ssl"
      - "unraid_backups:/archive"

volumes:
  dns_config:
    external: true
  dns_log:
    external: true
  unifi_persistent:
    external: true
  unifi_var-log:
    external: true
  unifi_data:
    external: true
  unifi_srv:
    external: true
  unifi_var-lib-unifi:
    external: true
  unifi_var-lib-mongodb:
    external: true
  unifi_etc-rabbitmq-ssl:
    external: true
  unraid_backups:
    driver: local
    driver_opts:
      type: nfs
      o: addr=192.168.1.12,nfsvers=4.2,rw,noatime,tcp,timeo=14
      device: :/mnt/user/remote-backups
