version: "3"
services:
  sendspin-bt:
    hostname: sendspin-bt
    domainname: home.lan
    image: ghcr.io/trudenboy/sendspin-bt-bridge:2.76.6@sha256:7ad0194a1e76d4d4662dfcc30dd1ce22689720394a1cde218f2683c2bf833af6
    network_mode: "host"
    devices:
      - /dev/bus/usb:/dev/bus/usb
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      TZ: 'Europe/Paris'
      SENDSPIN_SERVER: auto
      WEB_PORT: 8081
      BASE_LISTEN_PORT: 8928
      CONFIG_DIR: /config
      AUDIO_UID: 1000
      AUDIO_GID: 1000
      PULSE_SERVER: unix:/run/user/1000/pulse/native
      XDG_RUNTIME_DIR: /run/user/1000
    volumes:
      - /var/run/dbus:/var/run/dbus
      - /run/user/${AUDIO_UID:-1000}/pulse:/run/user/${AUDIO_UID:-1000}/pulse
      - /run/user/${AUDIO_UID:-1000}/pipewire-0:/run/user/${AUDIO_UID:-1000}/pipewire-0
      - data:/config
    restart: unless-stopped

volumes:
  data:
